[package]
name = "alpine-desktop"
version = "0.1.0"
description = "The alpine-code desktop app"
authors = ["tgoddessana"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "alpine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
