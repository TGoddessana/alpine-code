[project]
name = "alpine-code"
version = "0.1.0"
description = "A terminal coding agent built on alpineagents"
readme = "README.md"
authors = [
    { name = "tgoddessana", email = "twicegoddessana1229@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alpineagents>=0.1.0",
    "prompt-toolkit>=3.0.52",
    "rich>=14.0",
    "tree-sitter>=0.26",
    "tree-sitter-bash>=0.25.1",
]

[project.scripts]
alpine = "alpine_code.cli:main"
alpine-code = "alpine_code.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The core must stay usable from any frontend (terminal, TUI, IDE, web).
[tool.importlinter]
root_package = "alpine_code"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is UI-agnostic"
type = "forbidden"
source_modules = ["alpine_code.core"]
forbidden_modules = ["alpine_code.cli", "rich", "prompt_toolkit"]
